name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - - name: Build APK
  working-directory: .
  run: flutter build apk --release
      - name: Upload ame: BAPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gold-miner-apk
          path: build/app/outputs/flutter-apk/app-release.apk